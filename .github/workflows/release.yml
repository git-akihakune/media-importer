name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match manifest.json version)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build (production)
        run: npm run build

      - name: Read manifest version
        id: manifest
        run: node scripts/release-info.mjs

      - name: Determine expected version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "version=${tag}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert version consistency
        run: |
          manifest_version="${{ steps.manifest.outputs.version }}"
          expected_version="${{ steps.ver.outputs.version }}"
          if [ "$manifest_version" != "$expected_version" ]; then
            echo "Mismatch: manifest.json version ($manifest_version) != expected ($expected_version)"
            exit 1
          fi
          echo "Version consistent: $manifest_version"

      - name: Update versions.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MIN_APP_VERSION: ${{ steps.manifest.outputs.min_app_version }}
        run: node scripts/update-versions.mjs

      - name: Commit versions.json
        run: |
          if [ -n "$(git status --porcelain versions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "chore: add ${{ steps.ver.outputs.version }} to versions.json [ci skip]"
            git push
          else
            echo "versions.json unchanged, nothing to commit"
          fi

      - name: Ensure tag exists (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.ver.outputs.tag }}';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              core.info(`Tag ${tag} already exists`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info(`Creating tag ${tag} on ${context.sha}`);
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
            }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            build/main.js
            build/manifest.json
            build/styles.css
          fail_on_unmatched_files: true
