name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match manifest.json version, without leading v)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build (production)
        run: npm run build

      - name: Read manifest version
        id: manifest
        run: node scripts/release-info.mjs

      - name: Determine expected version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert version consistency
        run: |
          manifest_version="${{ steps.manifest.outputs.version }}"
          expected_version="${{ steps.ver.outputs.version }}"
          if [ "$manifest_version" != "$expected_version" ]; then
            echo "Mismatch: manifest.json version ($manifest_version) != expected ($expected_version)"
            exit 1
          fi
          echo "Version consistent: $manifest_version"

      - name: Update versions.json
        if: steps.ver.outputs.version != ''
        run: |
          version="${{ steps.ver.outputs.version }}"
          min_app_version="${{ steps.manifest.outputs.min_app_version }}"
          node -e "
            const fs = require('fs');
            const path = 'versions.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (data['${version}']) {
              console.log('versions.json already has ${version}, skipping');
              process.exit(0);
            }
            data['${version}'] = '${min_app_version}';
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            console.log('Added ${version} -> ${min_app_version} to versions.json');
          "

      - name: Commit versions.json
        if: steps.ver.outputs.version != ''
        run: |
          if [ -n "$(git status --porcelain versions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "chore: add ${{ steps.ver.outputs.version }} to versions.json [ci skip]"
            git push
          else
            echo "versions.json unchanged, nothing to commit"
          fi